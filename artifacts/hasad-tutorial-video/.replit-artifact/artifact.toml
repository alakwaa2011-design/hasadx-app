kind = "video"
previewPath = "/hasad-tutorial-video/"
title = "حصاد · فيديو تعليمي"
version = "1.0.0"
id = "artifacts/hasad-tutorial-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/hasad-tutorial-video/" ]
localPort = 24991

[services.development]
run = "pnpm --filter @workspace/hasad-tutorial-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hasad-tutorial-video", "run", "build" ]
publicDir = "artifacts/hasad-tutorial-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24991"
BASE_PATH = "/hasad-tutorial-video/"
