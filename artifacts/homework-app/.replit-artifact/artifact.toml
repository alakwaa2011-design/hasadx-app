kind = "web"
previewPath = "/"
title = "منصة حصاد"
version = "1.0.0"
id = "artifacts/homework-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18313

[services.development]
run = "pnpm --filter @workspace/homework-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homework-app", "run", "build" ]
run = "pnpm --filter @workspace/homework-app run serve"

[services.env]
PORT = "18313"
BASE_PATH = "/"
