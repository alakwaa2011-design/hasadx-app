kind = "mobile"
previewPath = "/mushaf-hasaad-mobile/"
title = "مصحف حصاد"
description = "تطبيق مصحف حصاد مستقل للآيفون وأندرويد بقراءة وتنقل وعلامات وإعدادات أصلية، ويعيد استخدام صفحات المصحف والبيانات المعتمدة."
version = "1.0.0"
id = "artifacts/mushaf-hasaad-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mushaf-hasaad-mobile/" ]
localPort = 25454

[services.development]
run = "pnpm --filter @workspace/mushaf-hasaad-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mushaf-hasaad-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mushaf-hasaad-mobile", "run", "serve" ]

[services.env]
PORT = "25454"
BASE_PATH = "/mushaf-hasaad-mobile/"
