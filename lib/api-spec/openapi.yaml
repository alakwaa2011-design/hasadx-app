        "404": { description: Not found }

  /presentations/ai/outline/jobs/by-key/{key}:
    get:
      operationId: getPresentationOutlineJobByKey
      tags: [presentations]
      summary: Get an owned outline job by idempotency key
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Outline job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationOutlineJob"
        "404": { description: Not found }

  /presentations/ai/build/{draftId}:
    post:
      operationId: buildPresentationFromDraft
      tags: [presentations]
      summary: Phase 1B — materialize an approved outline into a real deck
      description: |
        Per-slide materialization with skip-on-failure semantics. Failed
        slides are reported in `skipped` so the teacher can author them
        manually. Progress is persisted on the draft row after every
        slide so a parallel poll on `GET /presentations/drafts/{id}`
        can drive a real progress bar without SSE plumbing.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildPresentationRequest"
      responses:
        "200":
          description: Already built — returns the existing presentation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPresentationResponse"
        "201":
          description: Built — returns the newly created presentation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPresentationResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Draft is not in `outline_ready` state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Build failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/ai/build/{draftId}/stream:
    get:
      operationId: streamPresentationBuild
      tags: [presentations]
      summary: Phase 1B — SSE stream of build progress
      description: |
        Server-Sent Events feed: emits `progress` events on each
        polling tick and a terminal `done` event when the build
        finishes (status `built` or `failed`). Consumed via the
        browser's `EventSource`. Polling on the draft row remains
        available as a fallback driver.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event stream opened
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/ai/build/{draftId}/cancel:
    post:
      operationId: cancelPresentationBuild
      tags: [presentations]
      summary: Phase 1B — request cancellation of an in-flight build
      description: |
        Sets an in-memory cancel flag the build loop checks once per
        slide. Idempotent. Slides validated before the cancel arrived
        are still persisted into the resulting deck.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancel requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBuildResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/drafts:
