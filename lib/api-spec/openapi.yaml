openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Homework auto-grading platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Teacher authentication
  - name: assignments
    description: Assignment management
  - name: submissions
    description: Student submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerTeacher
      tags: [auth]
      summary: Register a new teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTeacherBody"
      responses:
        "201":
          description: Teacher registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginTeacher
      tags: [auth]
      summary: Teacher login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTeacherBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentTeacher
      tags: [auth]
      summary: Get current teacher info
      responses:
        "200":
          description: Current teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateTeacherProfile
      tags: [auth]
      summary: Update teacher profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          description: Not authenticated

  /auth/role:
    patch:
      operationId: updateTeacherRole
      tags: [auth]
      summary: Change current user's role (teacher ↔ organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleBody"
      responses:
        "200":
          description: Updated profile with new role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "400":
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutTeacher
      tags: [auth]
      summary: Logout teacher
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/google:
    post:
      operationId: loginTeacherWithGoogle
      tags: [auth]
      summary: Login or register a teacher using a Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing or invalid Google credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Google ID token verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/preferences:
    get:
      operationId: getBriefPreferences
      tags: [auth]
      summary: Get the teacher's saved brief preferences
      responses:
        "200":
          description: Saved preferences (empty object if none saved yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateBriefPreferences
      tags: [auth]
      summary: Persist the teacher's brief preferences server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefPreferences"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions:
    get:
      operationId: listTeacherSessions
      tags: [auth]
      summary: List active sessions for the current teacher
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherSession"
        "401":
          description: Not authenticated
    delete:
      operationId: revokeOtherTeacherSessions
      tags: [auth]
      summary: Revoke all sessions for the current teacher except the current one
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSessionsResponse"
        "401":
          description: Not authenticated

  /auth/sessions/{sid}:
    delete:
      operationId: revokeTeacherSession
      tags: [auth]
      summary: Revoke a specific session for the current teacher
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked (also returns whether it was the current session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSessionResponse"
        "401":
          description: Not authenticated
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/assignments/{id}/hide:
    patch:
      operationId: adminHideAssignment
      tags: [admin]
      summary: Hide a shared assignment from the public library (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        "200": { description: Assignment hidden }
        "401": { description: Not authenticated }
        "403": { description: Not an admin }
        "404": { description: Assignment not found }

  /admin/assignments/{id}/unhide:
    patch:
      operationId: adminUnhideAssignment
      tags: [admin]
      summary: Restore a previously hidden assignment to the public library
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Assignment restored }
        "401": { description: Not authenticated }
        "403": { description: Not an admin }
        "404": { description: Assignment not found }

  /admin/question-bank/{id}/hide:
    patch:
      operationId: adminHideQuestionBankItem
      tags: [admin]
      summary: Hide a shared question-bank item from the public library
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        "200": { description: Question hidden }
        "401": { description: Not authenticated }
        "403": { description: Not an admin }
        "404": { description: Question not found }

  /admin/question-bank/{id}/unhide:
    patch:
      operationId: adminUnhideQuestionBankItem
      tags: [admin]
      summary: Restore a hidden question-bank item to the public library
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Question restored }
        "401": { description: Not authenticated }
        "403": { description: Not an admin }
        "404": { description: Question not found }

  /admin/video-lessons/{id}/hide:
    patch:
      operationId: adminHideVideoLesson
      tags: [admin]
      summary: Hide a shared video lesson from the public library
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        "200": { description: Video lesson hidden }
        "401": { description: Not authenticated }
        "403": { description: Not an admin }
        "404": { description: Video lesson not found }

  /admin/video-lessons/{id}/unhide:
    patch:
      operationId: adminUnhideVideoLesson
      tags: [admin]
      summary: Restore a hidden video lesson to the public library
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Video lesson restored }
        "401": { description: Not authenticated }
        "403": { description: Not an admin }
        "404": { description: Video lesson not found }

  /admin/teachers:
    get:
      operationId: listAllTeachers
      tags: [admin]
      summary: List all registered teachers with stats
      responses:
        "200":
          description: List of teachers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTeacherSummary"
        "401":
          description: Not authenticated

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List all assignments
      parameters:
        - name: teacherId
          in: query
          schema:
            type: integer
        - name: include
          in: query
          description: Set to "shared" to include other teachers' admin-approved shared assignments
          schema:
            type: string
            enum: [shared]
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"

    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create a new assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentBody"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get assignment with questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentWithQuestions"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /assignments/{id}/start-exam:
    post:
      operationId: startExamSession
      tags: [submissions]
      summary: Start an exam session (server-side timing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExamBody"
      responses:
        "200":
          description: Exam session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSessionResponse"

  /assignments/{id}/submit:
    post:
      operationId: submitAssignment
      tags: [submissions]
      summary: Submit answers for an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssignmentBody"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"

  /assignments/{id}/submit-image:
    post:
      operationId: submitAssignmentImage
      tags: [submissions]
      summary: Submit assignment via uploaded image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitImageBody"
      responses:
        "200":
          description: Submission result from image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"

  /assignments/{id}/submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List submissions for an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"

  /assignments/{id}/export-csv:
    get:
      operationId: exportSubmissionsCsv
      tags: [submissions]
      summary: Export submissions as CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /submissions/{submissionId}:
    patch:
      operationId: updateSubmission
      tags: [Submissions]
      summary: Update submission grade (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubmissionBody"
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/{submissionId}/details:
    get:
      operationId: getSubmissionDetails
      tags: [submissions]
      summary: Get full submission with per-answer details (teacher only)
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission with answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetail"

  /submission-answers/{answerId}:
    patch:
      operationId: updateAnswerGrade
      tags: [submissions]
      summary: Manually grade a single answer (teacher only)
      parameters:
        - name: answerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnswerBody"
      responses:
        "200":
          description: Updated answer + recomputed submission totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetail"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit feedback or suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackBody"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /presentations/limits:
    get:
      operationId: getPresentationsLimits
      tags: [presentations]
      summary: Get the effective presentations tier and limits for the caller
      responses:
        "200":
          description: Tier resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationTier"

  /presentations/{id}/usage:
    get:
      operationId: getPresentationUsage
      tags: [presentations]
      summary: Get tier limits + per-deck usage for a single presentation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tier + usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationTierWithUsage"

  /presentations:
    get:
      operationId: listPresentations
      tags: [presentations]
      summary: List own presentations + admin-shared
      responses:
        "200":
          description: List of presentations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresentationSummary"
        "401":
          description: Not authenticated
    post:
      operationId: createPresentation
      tags: [presentations]
      summary: Create a new presentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePresentationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"

  /presentations/{id}:
    get:
      operationId: getPresentation
      tags: [presentations]
      summary: Get a presentation (owner or admin-shared)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Presentation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
        "404":
          description: Not found
    put:
      operationId: updatePresentation
      tags: [presentations]
      summary: Update a presentation (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePresentationBody"
      responses:
        "200":
          description: Updated presentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
    delete:
      operationId: deletePresentation
      tags: [presentations]
      summary: Delete a presentation (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /presentations/{id}/publish:
    post:
      operationId: publishPresentation
      tags: [presentations]
      summary: Publish a presentation (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"

  /presentations/{id}/unpublish:
    post:
      operationId: unpublishPresentation
      tags: [presentations]
      summary: Move a presentation back to draft (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"

  /presentations/{id}/link-activity:
    patch:
      operationId: linkPresentationActivity
      tags: [presentations]
      summary: Link or unlink the presentation to a teacher activity (assignment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activityId:
                  type: integer
                  nullable: true
                activityKind:
                  type: string
                  default: assignment
              required:
                - activityId
      responses:
        "200":
          description: Updated link
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  linkedActivityId:
                    type: string
                    nullable: true
                  linkedActivityKind:
                    type: string
                    nullable: true
                required: [id]

  /presentations/{id}/linked-activity:
    get:
      operationId: getPresentationLinkedActivity
      tags: [presentations]
      summary: Resolve the linked activity (or null if none / dangling)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Linked activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    nullable: true
                  activity:
                    nullable: true
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                    required: [id, title]
                  link:
                    type: string
                    nullable: true
                    description: Relative URL to open the linked activity, or null when there is no resolved link.
                required: [activity, kind, link]

  /presentations/{id}/duplicate:
    post:
      operationId: duplicatePresentation
      tags: [presentations]
      summary: Duplicate a presentation (owner or admin-shared)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"

  /presentations/{id}/assets:
    get:
      operationId: listPresentationAssets
      tags: [presentations]
      summary: List uploaded assets for a presentation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresentationAsset"
    post:
      operationId: registerPresentationAsset
      tags: [presentations]
      summary: Register an uploaded asset URL on a presentation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAssetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationAsset"

  /presentations/ai/limits:
    get:
      operationId: getPresentationAiLimits
      tags: [presentations]
      summary: Tier-driven limits for AI outline generation
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationAiLimits"

  /presentations/ai/outline:
    post:
      operationId: generatePresentationOutline
      tags: [presentations]
      summary: Generate a reviewable outline (Phase 1A) — does NOT build slides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationBrief"
      responses:
        "201":
          description: Draft created with validated outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationDraftWithGuardrails"
        "403":
          description: Tier limit hit (slides/density)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not produce a valid outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily outline limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/ai/build/{draftId}:
    post:
      operationId: buildPresentationFromDraft
      tags: [presentations]
      summary: Phase 1B — materialize an approved outline into a real deck
      description: |
        Per-slide materialization with skip-on-failure semantics. Failed
        slides are reported in `skipped` so the teacher can author them
        manually. Progress is persisted on the draft row after every
        slide so a parallel poll on `GET /presentations/drafts/{id}`
        can drive a real progress bar without SSE plumbing.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildPresentationRequest"
      responses:
        "200":
          description: Already built — returns the existing presentation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPresentationResponse"
        "201":
          description: Built — returns the newly created presentation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPresentationResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Draft is not in `outline_ready` state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Build failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/ai/build/{draftId}/stream:
    get:
      operationId: streamPresentationBuild
      tags: [presentations]
      summary: Phase 1B — SSE stream of build progress
      description: |
        Server-Sent Events feed: emits `progress` events on each
        polling tick and a terminal `done` event when the build
        finishes (status `built` or `failed`). Consumed via the
        browser's `EventSource`. Polling on the draft row remains
        available as a fallback driver.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event stream opened
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/ai/build/{draftId}/cancel:
    post:
      operationId: cancelPresentationBuild
      tags: [presentations]
      summary: Phase 1B — request cancellation of an in-flight build
      description: |
        Sets an in-memory cancel flag the build loop checks once per
        slide. Idempotent. Slides validated before the cancel arrived
        are still persisted into the resulting deck.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancel requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBuildResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presentations/drafts:
    get:
      operationId: listPresentationDrafts
      tags: [presentations]
      summary: List the current teacher's saved outline drafts
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresentationDraft"

  /presentations/drafts/{id}:
    get:
      operationId: getPresentationDraft
      tags: [presentations]
      summary: Read one draft (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationDraft"
    patch:
      operationId: updatePresentationDraft
      tags: [presentations]
      summary: Update outline or status (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePresentationDraftBody"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationDraft"
    delete:
      operationId: deletePresentationDraft
      tags: [presentations]
      summary: Delete a draft (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

