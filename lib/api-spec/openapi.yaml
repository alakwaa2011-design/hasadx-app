    PresentationTierWithUsage:
      type: object
      properties:
        isPro:
          type: boolean
        limits:
          $ref: "#/components/schemas/PresentationLimits"
        usage:
          $ref: "#/components/schemas/PresentationUsage"
      required:
        - isPro
