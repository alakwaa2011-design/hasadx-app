          nullable: true
          description: Optional topic/context string forwarded to the game setup page.
        questions:
          type: array
          nullable: true
          description: For `kind=hasad-game` — AI-generated complete question set. When present, the in-Hasad Activity Runner is opened with these questions pre-loaded instead of the legacy game-setup page.
          items:
            type: object
            properties:
              prompt:
                type: string
              options:
                type: array
                items: { type: string }
              correctIndex:
                type: integer
            required: [prompt, options, correctIndex]
        objectFit:
          type: string
          enum: [cover, contain, fill, none]
          nullable: true
          description: For `kind=image` — CSS object-fit applied to the image.
        objectPosition:
          type: string
          nullable: true
          description: For `kind=image` — CSS object-position, e.g. "center", "top", "50% 25%".
        imageOpacity:
          type: number
          nullable: true
          description: For `kind=image` — opacity 0–1 (default 1).
        imageBorderRadius:
          type: number
          nullable: true
          description: For `kind=image` — border-radius in pixels (0–500).
        videoKind:
          type: string
          enum: [youtube, hasad-video]
          nullable: true
          description: For `kind=video-embed` — the source platform of the video.
        videoId:
          type: string
          nullable: true
          description: For `kind=video-embed` — extracted video identifier (YouTube video ID or Hasad lesson ID).
        title:
          type: string
          nullable: true
          description: For `kind=video-embed` — optional display title shown in the editor preview.
      required:
        - id
        - kind
        - x
        - y
        - w
        - h

