        - usage

    PresentationBriefToggles:
      type: object
      properties:
        activities: { type: boolean }
        questions:  { type: boolean }
        poll:       { type: boolean }
        quiz:       { type: boolean }
      required: [activities, questions, poll, quiz]

    PresentationBrief:
      type: object
      properties:
        language:
          type: string
          enum: [ar, en]
        subject:     { type: string, minLength: 1, maxLength: 100 }
        gradeLevel:  { type: string, minLength: 1, maxLength: 50 }
        topic:       { type: string, minLength: 1, maxLength: 120 }
        presentationKind:
          type: string
          enum: [explain, review, interactive, quick, contest]
        slideCount:
          type: integer
          minimum: 5
          maximum: 30
        durationMinutes:
          type: integer
          enum: [15, 30, 45, 60]
        languageLevel:
          type: string
          enum: [simple, medium, advanced]
        density:
          type: string
          enum: [minimal, balanced, detailed]
        toggles:
          $ref: "#/components/schemas/PresentationBriefToggles"
        notes:
          type: string
          maxLength: 200
          nullable: true
      required:
        - language
        - subject
        - gradeLevel
        - topic
        - presentationKind
        - slideCount
        - durationMinutes
        - languageLevel
        - density
        - toggles

    OutlineSlideKind:
      type: string
      enum:
        - title
        - objectives
        - concept-card
        - comparison
        - visual-hero
        - steps
        - interactive
        - closure
        - timeline
        - formula
        - stat
        - quote
        - callout

    OutlineVisualDirection:
      type: object
      properties:
        icon:
          type: string
          maxLength: 40
        shape:
          type: string
          enum: [rect, circle, line, arrow, divider]
        layoutHint:
          type: string
          maxLength: 40

    OutlineSlideCard:
      type: object
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 30
        kind:
          $ref: "#/components/schemas/OutlineSlideKind"
        title:
          type: string
          minLength: 1
          maxLength: 80
        subtitle:
          type: string
          maxLength: 80
        purpose:
          type: string
          minLength: 1
          maxLength: 140
        talkingPoints:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 140
        interactionHint:
          type: string
          enum: [poll, quiz, discussion, activity]
          nullable: true
        visualDirection:
          $ref: "#/components/schemas/OutlineVisualDirection"
        source:
          type: string
          maxLength: 200
      required:
        - index
        - kind
        - title
        - purpose
        - talkingPoints
        - interactionHint
        - visualDirection

    OutlineTeachingFlowStage:
      type: object
      properties:
        stage:
          type: string
          enum: [opener, concept, practice, closure]
        slideIndices:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 30
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 240
      required: [stage, slideIndices, estimatedMinutes]

    PresentationOutline:
      type: object
      properties:
        language:
          type: string
          enum: [ar, en]
        density:
          type: string
          enum: [minimal, balanced, detailed]
        totalEstimatedMinutes:
          type: integer
          minimum: 1
          maximum: 240
        objectives:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 140
        teachingFlow:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/OutlineTeachingFlowStage"
        slides:
          type: array
          minItems: 3
          maxItems: 30
          items:
            $ref: "#/components/schemas/OutlineSlideCard"
      required:
        - language
        - density
        - totalEstimatedMinutes
        - objectives
        - teachingFlow
        - slides

    PresentationDraft:
      type: object
      properties:
        id: { type: integer }
        teacherId: { type: integer }
        presentationId:
          type: integer
          nullable: true
        brief:
          $ref: "#/components/schemas/PresentationBrief"
        outline:
          $ref: "#/components/schemas/PresentationOutline"
        status:
          type: string
          enum: [draft, outline_ready, building, built, failed]
        modelUsed:
          type: string
          nullable: true
        tokensUsed:
          type: integer
        costMicroUsd:
          type: integer
        errorMessage:
          type: string
          nullable: true
        buildProgress:
          type: object
          nullable: true
          properties:
            current: { type: integer }
            total:   { type: integer }
            warnings:
              type: array
              items: { type: string }
            skipped:
              type: array
              description: Outline indexes the materializer skipped (failed validation).
              items: { type: integer }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - teacherId
        - brief
        - outline
        - status
        - tokensUsed
        - costMicroUsd
        - createdAt
        - updatedAt

    BuildPresentationRequest:
      type: object
      properties:
        theme:
          type: string
          maxLength: 40
          description: Slide theme key from SLIDE_THEMES; defaults to "harvest" if omitted or unknown.
        pattern:
          type: string
          maxLength: 40
        coverEmoji:
          type: string
          maxLength: 8

    BuildPresentationResponse:
      type: object
      properties:
        presentationId:
          type: integer
        warnings:
          type: array
          items: { type: string }
        skipped:
          type: array
          description: Indexes of outline slides that failed validation and were not materialized.
          items: { type: integer }
        cancelled:
          type: boolean
          description: True when the build returned early due to a cancel request.
        alreadyBuilt:
          type: boolean
      required:
        - presentationId
        - warnings
        - alreadyBuilt

    CancelBuildResponse:
      type: object
      properties:
        ok:
          type: boolean
        wasActive:
          type: boolean
          description: True if a live in-memory build was found and flagged.
        status:
          type: string
          description: Current draft status at cancel time.
      required:
        - ok
        - wasActive

    PresentationDraftWithGuardrails:
      allOf:
        - $ref: "#/components/schemas/PresentationDraft"
        - type: object
          properties:
            guardrails:
              type: object
              properties:
                feedback:
                  type: array
                  items: { type: string }
                usedCache:
                  type: boolean
              required: [feedback, usedCache]
          required: [guardrails]

    UpdatePresentationDraftBody:
      type: object
      properties:
        outline:
          $ref: "#/components/schemas/PresentationOutline"
        status:
          type: string
          enum: [draft, outline_ready]

    PresentationAiLimits:
      type: object
      properties:
        tier:
          type: string
          enum: [standard, pro, claude]
        dailyOutlines: { type: integer }
        used:          { type: integer }
        remaining:     { type: integer }
        maxSlides:     { type: integer }
        allowedDensities:
          type: array
          items:
            type: string
            enum: [minimal, balanced, detailed]
        allowClaude:
          type: boolean
      required:
        - tier
        - dailyOutlines
        - used
        - remaining
        - maxSlides
        - allowedDensities
        - allowClaude
