components:
  parameters:
    QuranId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    QuranSurah:
      type: object
      properties:
        number: { type: integer, minimum: 1, maximum: 114 }
        arabicName: { type: string }
        ayahCount: { type: integer, minimum: 1 }
      required: [number, arabicName, ayahCount]

    QuranStudent:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        gradeLevel: { type: ["string", "null"] }
        studentClass: { type: ["string", "null"] }
      required: [id, name, gradeLevel, studentClass]

    QuranCircleMember:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        gradeLevel: { type: ["string", "null"] }
        studentClass: { type: ["string", "null"] }
      required: [id, name, gradeLevel, studentClass]

    QuranCircle:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        teacherClassId: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        members:
          type: array
          items: { $ref: "#/components/schemas/QuranCircleMember" }
      required: [id, name, teacherClassId, notes, members]

    QuranCircleInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        teacherClassId: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        studentIds:
          type: array
          items: { type: integer }
      required: [name, studentIds]

    QuranCircleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        teacherClassId: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        studentIds:
          type: array
          items: { type: integer }

    QuranWard:
      type: object
      properties:
        id: { type: integer }
        studentId: { type: integer }
        mode:
          type: string
          enum: [memorization, review, recitation, assessment]
        surahNumber: { type: integer, minimum: 1, maximum: 114 }
        surahName: { type: string }
        startAyah: { type: integer, minimum: 1 }
        endAyah: { type: integer, minimum: 1 }
        assignedDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        dueDate: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [assigned, in_progress, completed, needs_review]
      required: [id, studentId, mode, surahNumber, surahName, startAyah, endAyah, assignedDate, dueDate, notes, status]

    QuranReviewWard:
      allOf:
        - $ref: "#/components/schemas/QuranWard"
        - type: object
          properties:
            studentName: { type: string }
          required: [studentName]

